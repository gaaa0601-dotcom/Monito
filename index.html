<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frank Puma Martinez | Perfil</title>
<meta name="description" content="Administración de Redes y Telecomunicaciones. Mi CV, LinkedIn y contacto en un solo lugar.">
<meta name="theme-color" content="#020805">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020805;
    --panel: rgba(2,14,8,.86);
    --green: #00ff9c;
    --text: #d6ffe9;
    --muted: #7fb89b;
    --line: rgba(0,255,156,.35);
    --ink: #00160c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    background: var(--bg); color: var(--text);
    position: relative; overflow-x: hidden;
    display: flex; justify-content: center; padding: 44px 20px;
  }
  #lluvia { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .4; pointer-events: none; }
  /* Efecto monitor CRT */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  main { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  .perfil { text-align: center; margin-bottom: 22px; }
  .avatar {
    position: relative; width: 132px; height: 132px; margin: 0 auto 20px; border-radius: 16px; overflow: hidden;
    border: 2px solid var(--green); box-shadow: 0 0 22px rgba(0,255,156,.45), inset 0 0 18px rgba(0,255,156,.25);
  }
  .foto { width: 100%; height: 100%; object-fit: cover; display: block; background: #04170e; filter: contrast(1.05) saturate(.9); }
  .avatar::after {
    content: ""; position: absolute; left: 0; right: 0; top: -30%; height: 30%;
    background: linear-gradient(180deg, transparent, rgba(0,255,156,.35), transparent);
    animation: barrido 3.6s linear infinite;
  }
  @keyframes barrido { to { top: 110%; } }

  h1 {
    position: relative; display: inline-block;
    font-weight: 700; font-size: clamp(1.25rem, 6vw, 1.85rem); letter-spacing: .02em;
    color: var(--green); text-shadow: 0 0 14px rgba(0,255,156,.6); margin-bottom: 14px;
  }
  h1::before, h1::after { content: attr(data-text); position: absolute; left: 0; top: 0; opacity: 0; text-shadow: none; }
  h1::before { color: #00e5ff; animation: glitch1 5s steps(1) infinite; }
  h1::after { color: #ff2bd6; animation: glitch2 5s steps(1) infinite; }
  @keyframes glitch1 { 0%,92%,100% { opacity: 0; } 93% { opacity: .85; transform: translate(-3px,1px); clip-path: inset(10% 0 55% 0); } 96% { opacity: .85; transform: translate(2px,-1px); clip-path: inset(60% 0 8% 0); } }
  @keyframes glitch2 { 0%,92%,100% { opacity: 0; } 94% { opacity: .85; transform: translate(3px,-1px); clip-path: inset(45% 0 25% 0); } 97% { opacity: .85; transform: translate(-2px,1px); clip-path: inset(5% 0 70% 0); } }

  .carrera {
    display: block; width: fit-content; margin: 0 auto;
    padding: 7px 14px; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase;
    border: 1px solid var(--green); border-radius: 4px; background: var(--panel); color: var(--text);
  }
  .carrera b { color: var(--green); font-weight: 700; }

  /* Terminal */
  .terminal { margin: 24px 0 26px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 0 28px rgba(0,255,156,.12); }
  .barra { display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: rgba(0,255,156,.07); }
  .barra i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f56; }
  .barra i:nth-child(2) { background: #ffbd2e; } .barra i:nth-child(3) { background: #27c93f; }
  .barra span { margin-left: 8px; font-size: .72rem; color: var(--muted); }
  .cuerpo { padding: 14px 16px 16px; font-size: .88rem; line-height: 1.65; }
  .cmd { color: var(--muted); }
  .cmd b { color: var(--green); font-weight: 500; }
  .lema { display: flex; gap: 10px; align-items: flex-start; margin-top: 6px; color: var(--text); min-height: 3.3em; }
  .lema svg { width: 22px; height: 22px; flex: none; margin-top: 2px; fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cursor { display: inline-block; width: .6em; height: 1.05em; background: var(--green); vertical-align: -.17em; margin-left: 2px; animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }

  /* Botones */
  .enlaces { list-style: none; padding: 0; display: grid; gap: 12px; }
  .enlaces a {
    display: flex; align-items: center; gap: 14px; padding: 15px 16px;
    background: var(--panel); color: var(--text); text-decoration: none; font-weight: 500; font-size: .95rem;
    border: 1px solid var(--line); border-radius: 6px;
    transition: background .15s, color .15s, box-shadow .15s, border-color .15s;
  }
  .enlaces a:hover { background: var(--green); color: var(--ink); border-color: var(--green); box-shadow: 0 0 22px rgba(0,255,156,.55); }
  .enlaces a:focus-visible, .correo a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .enlaces .ico { width: 22px; height: 22px; flex: none; fill: var(--green); transition: fill .15s; }
  .enlaces a:hover .ico { fill: var(--ink); }
  .enlaces .tag { margin-left: auto; font-size: .78rem; color: var(--muted); transition: color .15s; }
  .enlaces a:hover .tag { color: var(--ink); }
  .enlaces .cv { border-color: var(--green); box-shadow: 0 0 16px rgba(0,255,156,.25); }

  .correo { text-align: center; margin-top: 26px; }
  .correo p { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
  .correo a {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: .88rem;
    color: var(--green); text-decoration: none; background: var(--panel);
    border: 1px dashed var(--green); border-radius: 6px; overflow-wrap: anywhere;
  }
  .correo a:hover { text-shadow: 0 0 10px rgba(0,255,156,.8); }
  .correo svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .sube { animation: sube .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
  @keyframes sube { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .avatar::after, h1::before, h1::after, .cursor, .sube { animation: none; }
    .enlaces a { transition: none; }
  }
</style>
</head>
<body>
<canvas id="lluvia" aria-hidden="true"></canvas>
<main>
  <header class="perfil">
    <div class="avatar sube" style="--d:.05s">
      <!-- La foto debe llamarse foto.jpg y estar en el mismo repositorio -->
      <img class="foto" src="foto.jpg" alt="Foto de Frank Puma Martinez">
    </div>
    <h1 class="sube" style="--d:.12s" data-text="FRANK PUMA MARTINEZ">FRANK PUMA MARTINEZ</h1>
    <p class="carrera sube" style="--d:.2s"><b>&gt;</b> Administración de Redes y Telecomunicaciones</p>

    <div class="terminal sube" style="--d:.28s">
      <div class="barra" aria-hidden="true"><i></i><i></i><i></i><span>frank@linux: ~</span></div>
      <div class="cuerpo">
        <div class="cmd" aria-hidden="true"><b>$</b> sudo cat /etc/lema</div>
        <div class="lema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
          <span><span id="lema" data-texto="Siempre estar protegido, Linux es clave.">Siempre estar protegido, Linux es clave.</span><span class="cursor" aria-hidden="true"></span></span>
        </div>
      </div>
    </div>
  </header>

  <ul class="enlaces">
    <li class="sube" style="--d:.36s">
      <a class="cv" href="https://drive.google.com/drive/folders/1PXzQHr48tTIgHo1B2oVroBoKm4yrefy0?usp=sharing" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v14H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16z"/></svg>
        Mi CV y documentos <span class="tag">./cv</span>
      </a>
    </li>
    <li class="sube" style="--d:.43s">
      <a href="https://www.linkedin.com/in/frank-puma-martinez/" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11.5H3V9.75zm6.5 0h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1v5.85h-4v-5.2c0-1.24-.02-2.84-1.73-2.84-1.73 0-2 1.35-2 2.75v5.29h-4V9.75z"/></svg>
        LinkedIn <span class="tag">./in</span>
      </a>
    </li>
    <li class="sube" style="--d:.5s">
      <a href="https://wa.me/51982216744" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.03 2a9.93 9.93 0 0 0-8.46 15.14L2 22l5.02-1.53A9.94 9.94 0 1 0 12.03 2zm5.8 14.12c-.24.68-1.41 1.3-1.95 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.8-4.18-4.94-4.37-.15-.19-1.18-1.57-1.18-3s.75-2.13 1.01-2.42c.27-.29.58-.36.77-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.82 2.01.89 2.15.08.15.13.32.03.51-.1.19-.15.32-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.61 2.01 1.11.99 2.04 1.3 2.33 1.44.29.15.46.12.63-.07.17-.19.73-.85.92-1.14.19-.29.39-.24.65-.15.27.1 1.7.8 1.99.95.29.15.48.22.55.34.08.12.08.7-.16 1.38z"/></svg>

  <div class="correo sube" style="--d:.58s">
    <p>// contacto</p>
    <a href="mailto:code45.gg@gmail.com">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      code45.gg@gmail.com
    </a>
  </div>
</main>

<script>
/* Lluvia estilo Matrix */
(function () {
  var c = document.getElementById('lluvia'), x = c.getContext('2d');
  var chars = '01アイウエオカキクケコサシスセソ{}<>/$#;:=+*'.split('');
  var fs = 16, w, h, drops = [], last = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * d; c.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);
    drops = []; for (var i = 0; i < Math.ceil(w / fs); i++) drops.push(Math.random() * h / fs);
    x.fillStyle = '#020805'; x.fillRect(0, 0, w, h);
  }
  function paint() {
    x.fillStyle = 'rgba(2,8,5,.10)'; x.fillRect(0, 0, w, h);
    x.font = fs + 'px "JetBrains Mono", monospace';
    for (var i = 0; i < drops.length; i++) {
      var ch = chars[Math.floor(Math.random() * chars.length)];
      x.fillStyle = Math.random() > .975 ? '#d6ffe9' : '#00ff9c';
      x.fillText(ch, i * fs, drops[i] * fs);
      if (drops[i] * fs > h && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }
  function loop(t) { if (t - last > 55) { paint(); last = t; } requestAnimationFrame(loop); }
  var timer;
  window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(function () { size(); if (reduce) for (var k = 0; k < 40; k++) paint(); }, 200); });
  size();
  if (reduce) { for (var k = 0; k < 40; k++) paint(); } else { requestAnimationFrame(loop); }
})();

/* Frase escribiéndose */
(function () {
  var el = document.getElementById('lema'); if (!el) return;
  var txt = el.getAttribute('data-texto');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.setAttribute('aria-label', txt); el.textContent = '';
  var i = 0;
  setTimeout(function type() { el.textContent = txt.slice(0, ++i); if (i < txt.length) setTimeout(type, 55); }, 1000);
})();
</script>
</body>
</html>
